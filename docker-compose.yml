version: '3.8'

services:
  telegram-bot:
    build: .
    container_name: telegram_subscription_bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./qr_codes:/app/qr_codes
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Опционально: ограничение ресурсов
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
